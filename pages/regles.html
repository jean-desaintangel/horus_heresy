<!doctype html>
<html lang="fr">
<!-- ============================================================
     FICHE D'IDENTITÉ DE LA PAGE — Glossaire des règles spéciales
     Fichier : pages/regles.html

     Liste de toutes les règles spéciales, avec recherche instantanée et
     insensible aux accents.
     Charge js/regles-data.js (les données) PUIS js/regles.js (le rendu et la
     recherche) : c'est la convention du projet — les données d'un côté, la
     logique de l'autre, et l'ordre des balises <script> fait la dépendance
     (tous en `defer`, donc exécutés dans l'ordre du document).
     Le <main> ne contient qu'un conteneur vide : tout le contenu est fabriqué
     en JavaScript, via textContent (jamais innerHTML) — réflexe anti-XSS.

     Rappels valables sur TOUTES les pages du site :
     - lang="fr" sur <html> : indispensable aux lecteurs d'écran
       (prononciation) et aux moteurs de recherche.
     - Le premier élément du <body> est le lien d'évitement « Aller au
       contenu principal » (WCAG 2.4.1) : invisible tant qu'on ne
       l'atteint pas au clavier.
     - Les <script> portent l'attribut `defer` : le navigateur les
       télécharge en parallèle du HTML mais ne les exécute qu'une fois le
       document construit, DANS L'ORDRE des balises. C'est ce qui garantit
       que les données sont chargées avant la logique qui les consomme.
     - Aucun style ni gestionnaire d'événement écrit en attribut (pas de
       style="…" ni de onclick="…") : présentation dans css/, comportement
       dans js/. Séparation des responsabilités.
     ============================================================ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Règles spéciales — Horus Heresy</title>
    <link
      rel="canonical"
      href="https://lagrandecroisade.fr/pages/regles.html"
    />
    <meta
      name="description"
      content="Référence rapide des règles spéciales Horus Heresy 3e édition : règles d'armes (Sonner, Brèche, Fusion...) et règles diverses (Frappe en profondeur, Peur...), avec recherche instantanée."
    />
    <!-- Polices auto-hébergées via css/style.css (RGPD : aucune requête
         vers Google Fonts) ; préchargement de la police du texte courant. -->
    <link
      rel="preload"
      href="../assets/fonts/lato-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="../css/style.css" />
    <link
      rel="icon"
      type="image/webp"
      href="../assets/favicon/favicon_sons_of_horus.webp"
    />
    <!-- Mode hors ligne (PWA) : manifest + icône iOS + couleur de
         thème de la barre système/barre d'adresse quand le site est
         installé (voir manifest.json, service-worker.js, js/main.js). -->
    <link rel="manifest" href="../manifest.json" />
    <link rel="apple-touch-icon" href="../assets/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#2c2a24" />
    <!-- Métadonnées de partage (Open Graph) : og:image et og:url exigent
         une URL ABSOLUE (le site qui affiche l’aperçu n’a aucun moyen de
         résoudre un chemin relatif). À mettre à jour en cas de changement
         d’hébergement. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta
      property="og:title"
      content="Règles spéciales — Horus Heresy, guide d’initiation"
    />
    <meta
      property="og:description"
      content="Référence rapide des règles spéciales Horus Heresy 3e édition, avec recherche instantanée."
    />
    <meta
      property="og:image"
      content="https://lagrandecroisade.fr/assets/img/hero.webp"
    />
    <meta
      property="og:url"
      content="https://lagrandecroisade.fr/pages/regles.html"
    />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Reconnaissance des mots-clés tapés au clavier (clins
         d'œil) : chargé AVANT le script principal, qui consomme
         surSequenceClavier. Les deux sont en `defer`, donc exécutés
         dans l'ordre des balises. -->
    <script src="../js/sequence-clavier.js" defer></script>
    <script src="../js/main.js" defer></script>
    <script src="../js/regles-data.js" defer></script>
    <script src="../js/regles.js" defer></script>
  </head>
  <body>
    <script>
      // Applique Nuit Éternelle avant le premier rendu (voir
      // activerNuitEternelle, js/main.js) : sans ce script bloquant, en
      // tout début de <body>, la page s'affiche d'abord en clair puis
      // bascule en sombre une fois main.js chargé (defer) — ce qui
      // déclenche la transition CSS de body.nuit-eternelle (le dégradé
      // blanc vers noir) à chaque changement de page.
      try {
        if (sessionStorage.getItem("hh-nuit-eternelle") === "1") {
          document.body.classList.add("nuit-eternelle");
        }
      } catch {}
    </script>
    <a class="lien-evitement" href="#contenu">Aller au contenu principal</a>
    <!-- ===================== NAVIGATION ===================== -->
    <header class="nav">
      <div class="nav-inner">
        <a class="nav-logo" href="../index.html"
          >Horus Heresy <span>· Guide d’initiation</span></a
        >
        <button
          type="button"
          class="nav-burger"
          aria-label="Ouvrir le menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <nav class="nav-principale" aria-label="Navigation principale">
          <ul class="nav-menu"></ul>
        </nav>
      </div>
    </header>

    <main id="contenu">
      <h1 class="section-titre section-titre--centre titre-page">
        Règles spéciales
      </h1>

      <!-- Barre de recherche : le filtre est géré par js/regles.js -->
      <label for="recherche" class="sr-only">Rechercher une règle</label>
      <input
        type="text"
        id="recherche"
        class="barre-recherche"
        placeholder="Rechercher une règle… (ex : fusion, peur, brèche)"
        autocomplete="off"
      />
      <p
        class="compteur-resultats"
        id="compteur"
        role="status"
        aria-live="polite"
        aria-atomic="true"
      ></p>

      <div class="encadre">
        <p>
          <strong>Rappel :</strong> ces tables sont une retranscription
          manuelle, mais c’est le livre de règles qui fait référence en cas de
          doute.
        </p>
      </div>

      <!-- ===================== RÈGLES D’ARMES =====================
           Les h2 rétablissent la hiérarchie de titres (h1 > h2 > h3 :
           les cartes générées par js/regles.js sont des h3) et donnent
           un intitulé perceptible à chaque section. Le filtre de
           recherche masque le groupe entier (titre compris) quand
           aucune règle ne correspond. -->
      <section class="groupe-regles" id="armes">
        <h2 class="section-titre">Règles d’armes</h2>
        <!-- Les cartes de règles sont générées par js/regles.js -->
        <div id="regles-armes"></div>
      </section>

      <!-- ===================== RÈGLES DIVERSES ===================== -->
      <section class="groupe-regles" id="diverses">
        <h2 class="section-titre">Règles diverses</h2>
        <div id="regles-diverses"></div>
      </section>
    </main>

    <footer></footer>
  </body>
</html>
