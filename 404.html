<!doctype html>
<html lang="fr">
<!-- ============================================================
     FICHE D'IDENTITÉ DE LA PAGE — Page d'erreur 404
     Fichier : 404.html

     Servie par GitHub Pages quand l'URL demandée n'existe pas.
     Particularité à retenir : tous ses chemins sont ABSOLUS (/css/…, /js/…)
     et non relatifs. Une 404 peut en effet être affichée depuis n'importe
     quelle URL inexistante, par exemple /truc/machin/ — un chemin relatif
     comme ../css/style.css y pointerait dans le vide et la page s'afficherait
     sans style.
     Le <meta name="robots" content="noindex"> évite que les moteurs de
     recherche indexent une page d'erreur.
     Le petit bloc <style> en ligne est l'exception assumée à la règle « tout
     le CSS dans css/style.css » : trois déclarations propres à cette seule
     page, qui ne méritent pas d'alourdir la feuille commune chargée par les
     19 autres.

     Rappels valables sur TOUTES les pages du site :
     - lang="fr" sur <html> : indispensable aux lecteurs d'écran
       (prononciation) et aux moteurs de recherche.
     - Le premier élément du <body> est le lien d'évitement « Aller au
       contenu principal » (WCAG 2.4.1) : invisible tant qu'on ne
       l'atteint pas au clavier.
     - Les <script> portent l'attribut `defer` : le navigateur les
       télécharge en parallèle du HTML mais ne les exécute qu'une fois le
       document construit, DANS L'ORDRE des balises. C'est ce qui garantit
       que les données sont chargées avant la logique qui les consomme.
     - Aucun style ni gestionnaire d'événement écrit en attribut (pas de
       style="…" ni de onclick="…") : présentation dans css/, comportement
       dans js/. Séparation des responsabilités.
     ============================================================ -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable — Horus Heresy</title>
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="La page demandée n'existe pas ou plus sur le guide d'initiation Horus Heresy."
    />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      main#contenu {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        min-height: 60vh;
      }
    </style>
    <link
      rel="icon"
      type="image/webp"
      href="/assets/favicon/favicon_sons_of_horus.webp"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/assets/pwa/apple-touch-icon.png" />
    <meta name="theme-color" content="#2c2a24" />
    <!-- Reconnaissance des mots-clés tapés au clavier (clins d'œil) :
         chargé AVANT main.js, qui consomme surSequenceClavier. Les deux
         sont en `defer`, donc exécutés dans l'ordre des balises.
         Chemins ABSOLUS sur cette page, contrairement aux autres : une
         404 peut être servie depuis n'importe quelle URL inexistante
         (/truc/machin/), où un chemin relatif ne résoudrait rien. -->
    <script src="/js/sequence-clavier.js" defer></script>
    <script src="/js/main.js" defer></script>
  </head>
  <body>
    <a class="lien-evitement" href="#contenu">Aller au contenu principal</a>
    <header class="nav">
      <div class="nav-inner">
        <a class="nav-logo" href="/index.html"
          >Horus Heresy <span>· Guide d’initiation</span></a
        >
        <button
          type="button"
          class="nav-burger"
          aria-label="Ouvrir le menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <nav class="nav-principale" aria-label="Navigation principale">
          <ul class="nav-menu"></ul>
        </nav>
      </div>
    </header>
    <main id="contenu">
      <h1>
        Cette page n'existe pas, comme la reconnaissance qu'auraient dû avoir
        les Iron Warriors.
      </h1>
      <p>
        <a href="/index.html">Retour à l’accueil</a>
      </p>
    </main>
    <footer></footer>
  </body>
</html>
