<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Accueil — Horus Heresy, guide d’initiation</title>
    <meta
      name="description"
      content="Guide d'initiation pour le jeu de figurines Horus Heresy 3e édition : construction d'armée, déroulement d'un tour, tables de référence et règles spéciales."
    />
    <!-- Polices Cinzel (titres) et Lato (texte) auto-hébergées via
         css/style.css : aucune requête vers Google Fonts, donc aucune
         IP de visiteur transmise à un tiers (RGPD / CNIL). On précharge
         la police du texte courant pour un premier rendu sans bascule. -->
    <link
      rel="preload"
      href="assets/fonts/lato-latin-400-normal.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link rel="stylesheet" href="css/style.css" />
    <link
      rel="icon"
      type="image/png"
      href="assets/favicon/favicon_sons_of_horus.png"
    />
    <!-- Métadonnées de partage (Open Graph) pour Discord, forums...
         og:image et og:url exigent une URL ABSOLUE : un partage se fait
         depuis un autre site, qui n'a aucun moyen de résoudre un chemin
         relatif. C'est la raison pour laquelle on répète ici le domaine
         complet, à mettre à jour en cas de changement d'hébergement.
         L'accueil était jusqu'ici la SEULE page sans og:image — donc la
         seule à se partager sans vignette, alors que c'est la plus
         partagée des seize. -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="fr_FR" />
    <meta property="og:title" content="Horus Heresy — Guide d’initiation" />
    <meta
      property="og:description"
      content="Guide non officiel pour Horus Heresy 3e édition : construction d'armée, phases de jeu, tables de référence et règles spéciales."
    />
    <meta
      property="og:image"
      content="https://jean-desaintangel.github.io/horus_heresy/assets/img/hero.webp"
    />
    <meta
      property="og:url"
      content="https://jean-desaintangel.github.io/horus_heresy/"
    />
    <!-- defer : téléchargé en parallèle du parsing, exécuté après le DOM.
         L'ordre des balises est préservé entre scripts defer. -->
    <script src="js/main.js" defer></script>
  </head>
  <body>
    <script>
      // Applique Nuit Éternelle avant le premier rendu (voir
      // activerNuitEternelle, js/main.js) : sans ce script bloquant, en
      // tout début de <body>, la page s'affiche d'abord en clair puis
      // bascule en sombre une fois main.js chargé (defer) — ce qui
      // déclenche la transition CSS de body.nuit-eternelle (le dégradé
      // blanc vers noir) à chaque changement de page.
      try {
        if (sessionStorage.getItem("hh-nuit-eternelle") === "1") {
          document.body.classList.add("nuit-eternelle");
        }
      } catch {}
    </script>
    <a class="lien-evitement" href="#contenu">Aller au contenu principal</a>
    <!-- ===================== NAVIGATION ===================== -->
    <header class="nav">
      <div class="nav-inner">
        <a class="nav-logo" href="index.html"
          >Horus Heresy <span>· Guide d’initiation</span></a
        >
        <button
          type="button"
          class="nav-burger"
          aria-label="Ouvrir le menu"
          aria-expanded="false"
        >
          ☰
        </button>
        <nav class="nav-principale" aria-label="Navigation principale">
          <ul class="nav-menu"></ul>
        </nav>
      </div>
    </header>

    <main class="main-accueil" id="contenu">
      <!-- ===================== HERO ===================== -->
      <section class="hero">
        <div class="hero-texte">
          <h1>Guide d’initiation</h1>
          <p class="devise">Horus Heresy 3<sup>e</sup> édition</p>
        </div>
        <div class="hero-image">
          <!-- WebP (−93 % vs le PNG d'origine).
               width/height : le navigateur réserve l'espace avant le
               chargement et évite le décalage de mise en page (CLS). -->
          <!-- L'alternative de l'image d'appui est portée par
               data-alt-appui plutôt que codée en JS : accessibilité
               (WCAG 1.1.1) et contenu rédactionnel restent dans le HTML,
               là où on les cherche pour les relire ou les traduire. -->
          <img
            id="hero-image"
            src="assets/img/hero.webp"
            data-src-defaut="assets/img/hero.webp"
            data-src-appui="assets/img/night_lords.webp"
            data-alt-defaut="Un Adeptus Astartes en armure, arme au poing, sur un champ de bataille en flammes"
            data-alt-appui="Un guerrier Night Lords en armure sombre, éclair bleu sur le plastron"
            width="800"
            height="1219"
            alt="Un Adeptus Astartes en armure, arme au poing, sur un champ de bataille en flammes"
          />
        </div>
      </section>
    </main>

    <!-- ===================== PIED DE PAGE ===================== -->
    <footer></footer>
    <!-- Default Statcounter code for Horus Heresy
https://jean-desaintangel.github.io/horus_heresy/ -->
    <script type="text/javascript">
      var sc_project = 13337655;
      var sc_invisible = 1;
      var sc_security = "7b1ddd1f";
    </script>
    <script
      type="text/javascript"
      src="https://www.statcounter.com/counter/counter.js"
      async
    ></script>
    <noscript
      ><div class="statcounter">
        <a
          title="Web Analytics"
          href="https://statcounter.com/"
          target="_blank"
          rel="noopener noreferrer"
          ><img
            class="statcounter"
            src="https://c.statcounter.com/13337655/0/7b1ddd1f/1/"
            alt="Web Analytics"
            referrerpolicy="no-referrer-when-downgrade"
        /></a></div
    ></noscript>
    <!-- End of Statcounter Code -->
    <script type="text/javascript">
      (function () {
        var heroImage = document.getElementById("hero-image");
        if (!heroImage) return;

        var srcDefaut = heroImage.dataset.srcDefaut;
        var srcAppui = heroImage.dataset.srcAppui;
        var altDefaut = heroImage.dataset.altDefaut;
        var altAppui = heroImage.dataset.altAppui;
        var delaiAppuiMs = 2000;
        var idMinuteur = null;

        // Accessibilité (WCAG 1.1.1 / RGAA 1.3) : on change l'alternative
        // EN MÊME TEMPS que la source. Sinon l'image affichée et le texte
        // annoncé par le lecteur d'écran divergent — l'alternative décrit
        // alors une image qui n'est plus à l'écran, ce qui est pire que
        // pas d'alternative du tout.
        function afficherImage(src, alt) {
          heroImage.src = src;
          heroImage.alt = alt;
        }

        function demarrerMinuteur() {
          annulerMinuteur();
          idMinuteur = setTimeout(function () {
            afficherImage(srcAppui, altAppui);
          }, delaiAppuiMs);
        }
        function annulerMinuteur() {
          if (idMinuteur !== null) {
            clearTimeout(idMinuteur);
            idMinuteur = null;
          }
        }
        function afficherImageDefaut() {
          annulerMinuteur();
          afficherImage(srcDefaut, altDefaut);
        }

        heroImage.addEventListener("pointerdown", demarrerMinuteur);
        heroImage.addEventListener("pointerup", afficherImageDefaut);
        heroImage.addEventListener("pointerleave", afficherImageDefaut);
        heroImage.addEventListener("pointercancel", afficherImageDefaut);
        heroImage.addEventListener("contextmenu", function (evenement) {
          evenement.preventDefault();
        });
      })();
    </script>
  </body>
</html>
